<!doctype html>
<meta charset="utf-8">
<title>流速标签检查</title>
<link rel="stylesheet" href="/extension/creation/x-velocity-badge.css">
<main id="timeline"></main>
<script src="/extension/creation/format.js"></script>
<script src="/extension/creation/x-velocity-badge.js"></script>
<script src="/tests/browser-check-harness.js"></script>
<script>
"use strict";
BrowserCheck.run(async check => {
  const { VelocityTier, badgeContent, create } = XReplyVelocityBadge;
  const now = Date.parse("2026-11-16T12:00:00Z");
  const hoursAgo = hours => new Date(now - hours * 3600000).toISOString();

  check("分档：起步／中速／高速", VelocityTier.of(500) === VelocityTier.SLOW && VelocityTier.of(1000) === VelocityTier.MEDIUM && VelocityTier.of(10000) === VelocityTier.FAST);
  const fast = badgeContent({ views: 240000, publishedAt: hoursAgo(2), followers: 3000 }, now, XReplyFormat);
  check("标签文字含流速与爆文倍数", fast.text === "🔥 12万/h · 80x粉", fast.text);
  const small = badgeContent({ views: 500, publishedAt: hoursAgo(1), followers: 9000 }, now, XReplyFormat);
  check("粉丝多于浏览时不显示倍数", small.text === "🌱 500/h", small.text);
  check("缺发布时间不显示", badgeContent({ views: 10 }, now, XReplyFormat) === null);

  // 按 X 卡片结构构造：作者行 [data-testid="User-Name"] 内含时间链接
  const card = (id, handle) => {
    const article = document.createElement("article");
    article.dataset.testid = "tweet";
    article.innerHTML = `<div data-testid="User-Name" style="display:flex;white-space:nowrap"><a href="/${handle}">${handle}</a>
      <a href="/${handle}/status/${id}"><time datetime="${hoursAgo(2)}">2h</time></a></div><div data-testid="tweetText">内容</div>`;
    document.getElementById("timeline").append(article);
    return article;
  };
  const first = card("9001", "alice");
  const second = card("9002", "bob");
  const sent = [];
  const listeners = [];
  const storage = {};
  const chrome = {
    runtime: { sendMessage: async message => { sent.push(message); return { ok: true, saved: true }; } },
    storage: { local: { get: async key => ({ [key]: storage[key] }) }, onChanged: { addListener: fn => listeners.push(fn) } }
  };
  const badges = create({ document, window, chrome, format: XReplyFormat, clock: () => now });
  const heightBefore = first.getBoundingClientRect().height;
  badges.remember([{ id: "x:9001", views: 240000, publishedAt: hoursAgo(2), followers: 3000 }]);
  badges.render();
  const badge = first.querySelector('[data-testid="User-Name"] > .xrc-velocity');
  check("有数据的帖子显示标签", badge?.textContent === "🔥 12万/h · 80x粉", badge?.textContent);
  check("没有数据的帖子不显示", !second.querySelector(".xrc-velocity"));
  check("不改变卡片高度", Math.abs(first.getBoundingClientRect().height - heightBefore) < 1,
    `${heightBefore} → ${first.getBoundingClientRect().height}`);

  let mutations = 0;
  const observer = new MutationObserver(records => { mutations += records.length; });
  observer.observe(first, { subtree: true, childList: true, attributes: true, characterData: true });
  badges.render();
  await new Promise(resolve => setTimeout(resolve, 0));
  check("重复渲染不改动 DOM", mutations === 0, `mutations=${mutations}`);
  observer.disconnect();

  let opened = false;
  first.addEventListener("click", () => { opened = true; });
  badge.click();
  await new Promise(resolve => setTimeout(resolve, 0));
  check("点击发送收藏请求且不触发打开帖子", sent[0]?.type === "CREATION_SAVE_X_POST" && sent[0].postId === "9001" && !opened, JSON.stringify(sent));
  check("收藏后显示星标", first.querySelector(".xrc-velocity").dataset.saved === "true");

  badges.start();
  await new Promise(resolve => setTimeout(resolve, 0));
  listeners.forEach(fn => fn({ creationVelocityBadge: { newValue: false } }, "local"));
  await new Promise(resolve => setTimeout(resolve, 300));
  check("关闭开关后移除标签", !first.querySelector(".xrc-velocity"));
  listeners.forEach(fn => fn({ creationVelocityBadge: { newValue: true } }, "local"));
  window.postMessage({ channel: "x-reply-context-v1", type: "CREATION_POST_METRICS", posts: [{ id: "x:9002", views: 5000, publishedAt: hoursAgo(2) }] }, location.origin);
  await new Promise(resolve => setTimeout(resolve, 400));
  check("收到页面指标消息后渲染新标签", second.querySelector(".xrc-velocity")?.textContent === "🚀 2500/h");
  check("重新开启后恢复原标签", Boolean(first.querySelector(".xrc-velocity")));
});
</script>
